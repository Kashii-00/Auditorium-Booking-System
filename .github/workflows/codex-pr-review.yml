name: codex-pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write   # to post a comment
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch base and head refs
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Keep the prompt short and repo-specific
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} for ${{ github.repository }}.
            Review ONLY the diff introduced by this PR.
            Prioritize: security (SQLi/XSS), API errors, MySQL queries, Node/Express patterns,
            React/TypeScript issues, and Nginx config pitfalls for /erp/.
            Give concise, actionable comments with code blocks where helpful.
        # Optional: tighten privileges (default is safest)
        # safety-strategy: drop-sudo

      - name: Post Codex feedback
        if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `${{ steps.codex.outputs.final-message }}`
            });
