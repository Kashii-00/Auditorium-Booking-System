name: ai-pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Pre-fetch base and head refs
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }}

      - name: Install Ollama (local LLM runtime)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama || true
          # Pull a compact code model (change if you prefer)
          ollama pull qwen2.5-coder:7b

      - name: Build unified diff (base...head)
        run: |
          git diff --unified=0 --no-color \
            ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} > pr.diff
          # Keep payload bounded (~120 KB)
          head -c 120000 pr.diff > pr.diff.trunc || true

      - name: Ask the model for a review (local HTTP call)
        id: ask
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          jq -n --arg diff "$(sed 's/`/\\`/g' pr.diff.trunc)" --arg pr "${{ github.event.pull_request.number }}" --arg repo "${{ github.repository }}" '{
            model: "qwen2.5-coder:7b",
            stream: false,
            messages: [
              {"role":"system","content":"You are a strict senior reviewer. Review ONLY the unified diff. Focus on: security (SQLi/XSS), API errors, MySQL queries, Node/Express patterns, React/TypeScript issues, and Nginx pitfalls for /erp/. Give concise, actionable findings. Use bullet points; include short code blocks where helpful. If nothing critical, say so."},
              {"role":"user","content": ("PR #" + $pr + " for " + $repo + ". Unified diff:\n```diff\n" + $diff + "\n```")}
            ]
          }' > body.json

          curl -s http://localhost:11434/api/chat -d @body.json \
            | jq -r '.message.content // ""' > review.txt

          # Expose content (if any) as output
          summary=$(head -c 60000 review.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "review=$summary" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.ask.outputs.review != ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.ask.outputs.review }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
